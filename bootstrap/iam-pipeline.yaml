AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Satom Cloud Network - Amorcage (deploye une seule fois, avant la pipeline) : federation OIDC GitHub,
  role de la pipeline (lecture, tests, lancement CloudFormation) et role d'execution CloudFormation
  (seul autorise a creer les ressources). Moindre privilege : la pipeline ne cree rien elle-meme.

Parameters:
  Equipe:
    Type: String
    Default: af
  ProprietaireGitHub:
    Type: String
    Description: Compte GitHub qui heberge le depot (ex. adriano-ferreira)
  DepotGitHub:
    Type: String
    Default: satom-leman-portail
  CreerFournisseurOidc:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: false si token.actions.githubusercontent.com existe deja dans le compte (un seul par compte)

Conditions:
  CreerOidc: !Equals [!Ref CreerFournisseurOidc, 'true']

Resources:
  FournisseurOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: CreerOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  RoleExecutionCfn:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'leman-${Equipe}-cfn-execution'
      Description: Utilise uniquement par CloudFormation pour creer les ressources du portail
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: cloudformation.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess']
      Policies:
        - PolicyName: iam-limite-aux-roles-leman
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/leman-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/leman-*'
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }

  RolePipeline:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'leman-${Equipe}-github-pipeline'
      Description: Assume par GitHub Actions (OIDC) depuis le depot du portail uniquement
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreerOidc
                - !Ref FournisseurOidc
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals: { 'token.actions.githubusercontent.com:aud': sts.amazonaws.com }
              StringLike: { 'token.actions.githubusercontent.com:sub': !Sub 'repo:${ProprietaireGitHub}/${DepotGitHub}:*' }
      Policies:
        - PolicyName: deploiement-via-cloudformation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PilesDuPortail
                Effect: Allow
                Action: 'cloudformation:*'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/stack-leman-*/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:changeSet/*/*'
              - Sid: LectureCloudFormation
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListExports, cloudformation:DescribeStacks, cloudformation:ListStacks]
                Resource: '*'
              - Sid: PasserLeRoleExecution
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RoleExecutionCfn.Arn
              - Sid: PrerequisCertificat
                Effect: Allow
                Action: [acm:ImportCertificate, acm:ListCertificates, acm:DescribeCertificate, acm:AddTagsToCertificate, acm:ListTagsForCertificate]
                Resource: '*'
              - Sid: SuppressionPropre
                Effect: Allow
                Action: [s3:ListBucket, s3:ListBucketVersions, s3:DeleteObject, s3:DeleteObjectVersion]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::stack-leman-*'
                  - !Sub 'arn:${AWS::Partition}:s3:::stack-leman-*/*'
              - Sid: PurgeDesPreCles
                Effect: Allow
                Action: secretsmanager:DeleteSecret
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:psk-leman-*'
              - Sid: TestsEtMesures
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:GetManagedPrefixListEntries
                  - ec2:CreateNetworkInsightsPath
                  - ec2:StartNetworkInsightsAnalysis
                  - ec2:DeleteNetworkInsightsPath
                  - ec2:DeleteNetworkInsightsAnalysis
                  - ec2:CreateTags
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - elasticloadbalancing:Describe*
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:RegisterTargets
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:DescribeInstanceInformation
                  - route53:Get*
                  - route53:List*
                  - route53:TestDNSAnswer
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cloudfront:CreateInvalidation
                  - network-firewall:Describe*
                  - network-firewall:List*
                  - directconnect:Describe*
                  - wafv2:Get*
                  - wafv2:List*
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeComplianceByConfigRule
                  - budgets:ViewBudget
                  - secretsmanager:ListSecrets
                  - sns:ListSubscriptionsByTopic
                Resource: '*'
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }

Outputs:
  RolePipelineArn:
    Description: A copier dans la variable GitHub AWS_ROLE_ARN
    Value: !GetAtt RolePipeline.Arn
  RoleExecutionCfnArn:
    Description: A copier dans la variable GitHub AWS_CFN_ROLE_ARN
    Value: !GetAtt RoleExecutionCfn.Arn

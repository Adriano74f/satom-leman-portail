AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Satom Cloud Network - Portail Leman - 05 Calcul et equilibrage (sprint 9) : web-01 et app-01
  (IMDSv2, disques chiffres, administration SSM sans port 22), groupes cibles, ALB HTTPS TLS 1.2 minimum,
  regle /api/* priorite 10, journaux d'acces dans S3.

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    AllowedPattern: '^[a-z0-9]{2,8}$'
  PrefixeVpc:
    Type: String
    Default: '10.0'
  TypeInstance:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  CertificatAlbArn:
    Type: String
    Description: Certificat ACM de l'ecouteur HTTPS (importe par scripts/prerequis.sh)

Resources:
  # ---------- Administration sans SSH ----------
  RoleInstances:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'leman-${Environnement}-${Equipe}-instances'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  ProfilInstances:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'leman-${Environnement}-${Equipe}-instances'
      Roles: [!Ref RoleInstances]

  ModeleInstances:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub 'lt-portail-leman-${Environnement}-${Equipe}'
      LaunchTemplateData:
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        IamInstanceProfile: { Arn: !GetAtt ProfilInstances.Arn }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  # ---------- Serveurs (services Python integres : pas de paquet a installer) ----------
  Web01:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref TypeInstance
      LaunchTemplate: { LaunchTemplateId: !Ref ModeleInstances, Version: !GetAtt ModeleInstances.LatestVersionNumber }
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPublic1a' }
      PrivateIpAddress: !Sub '${PrefixeVpc}.1.10'
      SecurityGroupIds: [{ 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SgWeb' }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          mkdir -p /srv/web/static
          echo "OK web-01" > /srv/web/health
          echo "<h1>Portail Groupe Leman Finance SA</h1><p>web-01</p>" > /srv/web/index.html
          head -c 51200 /dev/urandom | base64 > /srv/web/static/logo.png
          cat > /etc/systemd/system/portail-web.service <<'EOF'
          [Unit]
          Description=Portail Leman - web-01
          After=network-online.target
          [Service]
          WorkingDirectory=/srv/web
          ExecStart=/usr/bin/python3 -m http.server 80
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload && systemctl enable --now portail-web
      Tags:
        - { Key: Name, Value: !Sub 'web-01-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  App01:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref TypeInstance
      LaunchTemplate: { LaunchTemplateId: !Ref ModeleInstances, Version: !GetAtt ModeleInstances.LatestVersionNumber }
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPrive1a' }
      PrivateIpAddress: !Sub '${PrefixeVpc}.2.10'
      SecurityGroupIds: [{ 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SgApp' }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          mkdir -p /srv/app/api
          echo "app-01 OK" > /srv/app/index.html
          echo "OK app-01" > /srv/app/api/health
          cat > /etc/systemd/system/portail-api.service <<'EOF'
          [Unit]
          Description=Portail Leman - app-01
          After=network-online.target
          [Service]
          WorkingDirectory=/srv/app
          ExecStart=/usr/bin/python3 -m http.server 8080
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload && systemctl enable --now portail-api
      Tags:
        - { Key: Name, Value: !Sub 'app-01-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- Groupes cibles (sans Target Optimizer : cause du 503 du module 9) ----------
  TgWeb:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'tg-web-${Environnement}-${Equipe}'
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '10' }
      Targets: [{ Id: !Ref Web01, Port: 80 }]
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  TgApp:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'tg-app-${Environnement}-${Equipe}'
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '10' }
      Targets: [{ Id: !Ref App01, Port: 8080 }]
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- Equilibreur ----------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'alb-${Environnement}-leman-${Equipe}'
      Type: application
      Scheme: internet-facing
      Subnets:
        - { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPublic1a' }
        - { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPublic1b' }
      SecurityGroups: [{ 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SgAlb' }]
      LoadBalancerAttributes:
        - { Key: access_logs.s3.enabled, Value: 'true' }
        - { Key: access_logs.s3.bucket, Value: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-BucketJournauxAlb' } }
        - { Key: access_logs.s3.prefix, Value: alb }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: 'false' }
      Tags:
        - { Key: Name, Value: !Sub 'alb-${Environnement}-leman-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  EcouteurHttps:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06     # TLS 1.2 minimum
      Certificates: [{ CertificateArn: !Ref CertificatAlbArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TgWeb }]
  RegleApiHttps:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref EcouteurHttps
      Priority: 10
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: ['/api/*'] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref TgApp }]

  # Origine CloudFront : HTTP 80, reserve par le Security Group a la liste de prefixes CloudFront
  EcouteurOrigine:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TgWeb }]
  RegleApiOrigine:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref EcouteurOrigine
      Priority: 10
      Conditions: [{ Field: path-pattern, PathPatternConfig: { Values: ['/api/*'] } }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref TgApp }]

Outputs:
  AlbDns:
    Value: !GetAtt Alb.DNSName
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-AlbDns' }
  AlbNomComplet:
    Value: !GetAtt Alb.LoadBalancerFullName
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-AlbNomComplet' }
  TgWebNomComplet:
    Value: !GetAtt TgWeb.TargetGroupFullName
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-TgWebNomComplet' }
  TgWebArn:
    Value: !Ref TgWeb
  TgAppArn:
    Value: !Ref TgApp
  Web01Id:
    Value: !Ref Web01
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-Web01' }
  App01Id:
    Value: !Ref App01
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-App01' }

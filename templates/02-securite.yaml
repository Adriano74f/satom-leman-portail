AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Satom Cloud Network - Portail Leman - 02 Securite (sprint 3) : Security Groups de l'ALB, du web et de l'API,
  NACL des sous-reseaux publics et prives. Aucun port d'administration ouvert : l'administration passe par SSM.

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    AllowedPattern: '^[a-z0-9]{2,8}$'
  PrefixeVpc:
    Type: String
    Default: '10.0'
  PrefixeDev:
    Type: String
    Default: '10.1'
    Description: Deux premiers octets du VPC de developpement (peering / TGW)
  PrefixListCloudFront:
    Type: String
    Default: ''
    Description: ID de la liste geree com.amazonaws.global.cloudfront.origin-facing (trouvee par le script de deploiement)

Conditions:
  AvecPrefixCloudFront: !Not [!Equals [!Ref PrefixListCloudFront, '']]

Resources:
  # ---------- Security Groups ----------
  SgAlb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB du portail - HTTPS 443 public, HTTP 80 reserve a CloudFront
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS clients }
      Tags:
        - { Key: Name, Value: !Sub 'sg-alb-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  SgAlbDepuisCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AvecPrefixCloudFront
    Properties:
      GroupId: !Ref SgAlb
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref PrefixListCloudFront
      Description: Origine CloudFront uniquement

  SgWeb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: web-01 - HTTP 80 depuis l ALB uniquement
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref SgAlb, Description: HTTP depuis ALB }
      Tags:
        - { Key: Name, Value: !Sub 'sg-web-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  SgApp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app-01 - API 8080 depuis le web, l ALB (regle api) et le VPC de developpement
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref SgWeb, Description: API depuis web-01 }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref SgAlb, Description: Regle api de l ALB }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: !Sub '${PrefixeDev}.0.0/16', Description: API depuis dev-01 }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: !Sub '${PrefixeDev}.0.0/16', Description: Traceroute depuis dev }
      Tags:
        - { Key: Name, Value: !Sub 'sg-app-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- NACL publique ----------
  NaclPublique:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      Tags:
        - { Key: Name, Value: !Sub 'nacl-public-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  NaclPubRefusSsh:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 90, Protocol: 6, RuleAction: deny, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 22, To: 22 } }
  NaclPubHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  NaclPubHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  NaclPubEphemeres:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  NaclPubVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 130, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: !Sub '${PrefixeVpc}.0.0/16' }
  NaclPubSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPublique, RuleNumber: 100, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0 }
  AssocNaclPub1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref NaclPublique
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPublic1a' }
  AssocNaclPub1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref NaclPublique
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPublic1b' }

  # ---------- NACL privee ----------
  NaclPrivee:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
      Tags:
        - { Key: Name, Value: !Sub 'nacl-prive-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  NaclPrivRefusSsh:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 90, Protocol: 6, RuleAction: deny, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 22, To: 22 } }
  NaclPrivVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 100, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: !Sub '${PrefixeVpc}.0.0/16' }
  NaclPrivDev:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 110, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: !Sub '${PrefixeDev}.0.0/16' }
  NaclPrivSites:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 120, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: 192.168.0.0/16 }
  NaclPrivEphemeres:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 130, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  NaclPrivSortie:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref NaclPrivee, RuleNumber: 100, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 0.0.0.0/0 }
  AssocNaclPriv1a:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref NaclPrivee
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPrive1a' }
  AssocNaclPriv1b:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref NaclPrivee
      SubnetId: { 'Fn::ImportValue': !Sub 'leman-${Environnement}-${Equipe}-SubPrive1b' }

Outputs:
  SgAlb:
    Value: !Ref SgAlb
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SgAlb' }
  SgWeb:
    Value: !Ref SgWeb
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SgWeb' }
  SgApp:
    Value: !Ref SgApp
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SgApp' }

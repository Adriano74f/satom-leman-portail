AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Satom Cloud Network - Portail Leman - 00 Socle : cle KMS, bucket des journaux ALB,
  topic SNS d'exploitation, pre-cles VPN generees dans Secrets Manager.
  Le budget est dans 00b-budget-us-east-1.yaml (AWS::Budgets::Budget n existe pas dans CloudFormation hors us-east-1 sur ce compte).

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    AllowedPattern: '^[a-z0-9]{2,8}$'
    Description: Suffixe d'equipe (compte AWS partage)
  EmailExploitation:
    Type: String
    Default: ''
    Description: Adresse abonnee au topic SNS et au budget (vide = aucune)

Conditions:
  AvecEmail: !Not [!Equals [!Ref EmailExploitation, '']]

Resources:
  # ---------- Chiffrement ----------
  CleKms:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'Cle Leman ${Environnement}-${Equipe} (journaux, SNS)'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministrationCompte
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          - Sid: JournauxCloudWatch
            Effect: Allow
            Principal: { Service: !Sub 'logs.${AWS::Region}.amazonaws.com' }
            Action: [kms:Encrypt*, kms:Decrypt*, kms:ReEncrypt*, kms:GenerateDataKey*, kms:Describe*]
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: AlarmesVersSns
            Effect: Allow
            Principal: { Service: [cloudwatch.amazonaws.com, budgets.amazonaws.com] }
            Action: [kms:Decrypt, kms:GenerateDataKey*]
            Resource: '*'
      Tags:
        - { Key: Name, Value: !Sub 'kms-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  AliasKms:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/leman-${Environnement}-${Equipe}'
      TargetKeyId: !Ref CleKms

  # ---------- Journaux d'acces de l'ALB ----------
  BucketJournauxAlb:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }   # seul mode accepte par les journaux ALB
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expiration-30j
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }
      Tags:
        - { Key: Name, Value: !Sub 's3-journaux-alb-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  PolitiqueBucketJournauxAlb:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketJournauxAlb
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LivraisonJournauxElb
            Effect: Allow
            Principal: { Service: logdelivery.elasticloadbalancing.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${BucketJournauxAlb.Arn}/alb/AWSLogs/${AWS::AccountId}/*'
          - Sid: RefusSansTls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt BucketJournauxAlb.Arn, !Sub '${BucketJournauxAlb.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  # ---------- Notifications ----------
  SujetExploitation:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'sns-exploitation-leman-${Environnement}-${Equipe}'
      KmsMasterKeyId: !Ref CleKms
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  AbonnementEmail:
    Type: AWS::SNS::Subscription
    Condition: AvecEmail
    Properties:
      TopicArn: !Ref SujetExploitation
      Protocol: email
      Endpoint: !Ref EmailExploitation

  # ---------- Pre-cles VPN : generees par AWS, jamais ecrites dans le depot ----------
  PskVpn1Tunnel1:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'psk-leman-${Environnement}-${Equipe}-vpn1-t1'
      Description: Pre-cle IKEv2 du tunnel 1 de la connexion VPN 1
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true, ExcludeCharacters: '0', IncludeSpace: false }
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  PskVpn1Tunnel2:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'psk-leman-${Environnement}-${Equipe}-vpn1-t2'
      Description: Pre-cle IKEv2 du tunnel 2 de la connexion VPN 1
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true, ExcludeCharacters: '0', IncludeSpace: false }
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  PskVpn2Tunnel1:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'psk-leman-${Environnement}-${Equipe}-vpn2-t1'
      Description: Pre-cle IKEv2 du tunnel 1 de la connexion VPN 2
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true, ExcludeCharacters: '0', IncludeSpace: false }
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  PskVpn2Tunnel2:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'psk-leman-${Environnement}-${Equipe}-vpn2-t2'
      Description: Pre-cle IKEv2 du tunnel 2 de la connexion VPN 2
      GenerateSecretString: { PasswordLength: 32, ExcludePunctuation: true, ExcludeCharacters: '0', IncludeSpace: false }
      Tags:
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

Outputs:
  CleKmsArn:
    Value: !GetAtt CleKms.Arn
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-CleKmsArn' }
  BucketJournauxAlb:
    Value: !Ref BucketJournauxAlb
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-BucketJournauxAlb' }
  SujetExploitationArn:
    Value: !Ref SujetExploitation
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SujetSns' }
  PskVpn1T1:
    Value: !Ref PskVpn1Tunnel1
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-PskVpn1T1' }
  PskVpn1T2:
    Value: !Ref PskVpn1Tunnel2
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-PskVpn1T2' }
  PskVpn2T1:
    Value: !Ref PskVpn2Tunnel1
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-PskVpn2T1' }
  PskVpn2T2:
    Value: !Ref PskVpn2Tunnel2
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-PskVpn2T2' }

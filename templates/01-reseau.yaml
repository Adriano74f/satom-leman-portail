AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Satom Cloud Network - Portail Leman - 01 Reseau (sprints 1 et 2) : VPC, sous-reseaux sur deux zones,
  Internet Gateway, NAT Gateway dans un sous-reseau dedie, tables de routage.
  La route par defaut des sous-reseaux prives est posee par 03-pare-feu (via le pare-feu ou la NAT).

Parameters:
  Environnement:
    Type: String
    AllowedValues: [dev, prod]
  Equipe:
    Type: String
    AllowedPattern: '^[a-z0-9]{2,8}$'
  PrefixeVpc:
    Type: String
    Default: '10.0'
    AllowedPattern: '^10\.\d{1,3}$'
    Description: Deux premiers octets du VPC de production (10.0 => 10.0.0.0/16)
  ZoneNat:
    Type: Number
    Default: 0
    AllowedValues: [0, 1, 2]
    Description: Index de la zone du sous-reseau NAT (quota de 5 NAT Gateway par zone sur le compte partage)

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Sub '${PrefixeVpc}.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub 'vpc-prod-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- Sous-reseaux (sprint 1) ----------
  SubPublic1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.1.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-public-1a-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  SubPrive1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.2.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-prive-1a-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  SubNat1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.3.0/24'
      AvailabilityZone: !Select [!Ref ZoneNat, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-nat-1a-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  SubFw1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.4.0/28'
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-fw-1a-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  SubPublic1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.5.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-public-1b-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  SubPrive1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Sub '${PrefixeVpc}.6.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub 'sub-prive-1b-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- Passerelles (sprint 2) ----------
  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub 'igw-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  IgwAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  EipNat:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachement
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub 'eip-nat-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  NatGw:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipNat.AllocationId
      SubnetId: !Ref SubNat1a
      Tags:
        - { Key: Name, Value: !Sub 'nat-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }

  # ---------- Tables de routage ----------
  RtPublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'rt-public-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  RoutePublicIgw:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachement
    Properties:
      RouteTableId: !Ref RtPublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  AssocPublic1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubPublic1a, RouteTableId: !Ref RtPublic }
  AssocPublic1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubPublic1b, RouteTableId: !Ref RtPublic }

  RtNat:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'rt-nat-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  RouteNatIgw:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachement
    Properties:
      RouteTableId: !Ref RtNat
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  AssocNat1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubNat1a, RouteTableId: !Ref RtNat }

  RtPrive:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'rt-prive-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  AssocPrive1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubPrive1a, RouteTableId: !Ref RtPrive }
  AssocPrive1b:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubPrive1b, RouteTableId: !Ref RtPrive }

  RtFw:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub 'rt-fw-leman-${Environnement}-${Equipe}' }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Equipe }
        - { Key: Environnement, Value: !Ref Environnement }
  AssocFw1a:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SubFw1a, RouteTableId: !Ref RtFw }

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-VpcId' }
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-VpcCidr' }
  SubPublic1a:
    Value: !Ref SubPublic1a
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubPublic1a' }
  SubPublic1b:
    Value: !Ref SubPublic1b
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubPublic1b' }
  SubPrive1a:
    Value: !Ref SubPrive1a
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubPrive1a' }
  SubPrive1b:
    Value: !Ref SubPrive1b
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubPrive1b' }
  SubNat1a:
    Value: !Ref SubNat1a
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubNat1a' }
  SubFw1a:
    Value: !Ref SubFw1a
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-SubFw1a' }
  RtPublic:
    Value: !Ref RtPublic
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-RtPublic' }
  RtPrive:
    Value: !Ref RtPrive
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-RtPrive' }
  RtNat:
    Value: !Ref RtNat
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-RtNat' }
  RtFw:
    Value: !Ref RtFw
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-RtFw' }
  NatGwId:
    Value: !Ref NatGw
    Export: { Name: !Sub 'leman-${Environnement}-${Equipe}-NatGw' }
